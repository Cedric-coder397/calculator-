<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
   <div class="calculator">
        <input type="text" id="screen">

        <br><br>
   <div class="top-row" style="margin-bottom: -20px;">
        <button class="on" onclick="turnon()">on</button>
        <button class="off" onclick="turnoff()">off</button>
        </div>
        <br>
         <button class="btn scientific">tan</button>
        <button class="btn scientific">log</button>
        <button class="btn scientific">In</button>
        <button class="btn scientific">cos</button>
        <button class="btn scientific">sin</button>
        <br>
        <button class="btn mode">bin</button>
        <button class="btn mode">Dec</button>
        <button class="btn mode">hex</button>
         <button class="btn operator">&radic;</button>
        <button class="btn operator">x*x</button>
        <br>
        <button class="btn">7</button>
        <button class="btn">8</button>
        <button class="btn">9</button>
        <button class="btn operator">AC</button>
        <button class="btn operator">DEL</button>
        <br>
        <button class="btn">4</button>
        <button class="btn">5</button>
        <button class="btn">6</button>
        <button class="btn operator">-</button>
        <button class="btn operator">+</button>
        <br>
        <button class="btn">1</button>
        <button class="btn">2</button>
        <button class="btn">3</button>
        <button class="btn operator">*</button>
        <button class="btn operator">/</button>
        <br>
        <button class="btn">0</button>
        <button class="btn">.</button>
        <button class="btn scientific">EXP</button>
        <button class="btn scientific">&pi;</button>
        <button id="equalbtn">=</button> 
        <br>
       
        
         </div>


        </div>

</body>
  <script src="script.js"></script>
</html>
